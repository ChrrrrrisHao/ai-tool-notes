<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2433" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1d2433"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d9482b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#fbf8f1"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <text x="600" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2433">一套規則，持續產生一致的新頁面</text>

  <g stroke="#1d2433" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M217 185H261"/>
    <path d="M457 185H501"/>
    <path d="M697 185H741"/>
    <path d="M937 185H981"/>
  </g>

  <g>
    <rect x="25" y="110" width="190" height="150" rx="14" fill="#fff" stroke="#e3dccb" stroke-width="2"/>
    <rect x="45" y="100" width="70" height="18" rx="2" fill="#d9482b" opacity="0.8" transform="rotate(-3 80 109)"/>
    <text x="120" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">規則</text>
    <text x="120" y="208" text-anchor="middle" font-size="16" fill="#4a5468" font-family="Consolas,monospace">AGENTS.md</text>
  </g>
  <g>
    <rect x="265" y="110" width="190" height="150" rx="14" fill="#fff" stroke="#e3dccb" stroke-width="2"/>
    <rect x="285" y="100" width="70" height="18" rx="2" fill="#2f6fde" opacity="0.8" transform="rotate(-3 320 109)"/>
    <text x="360" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">模板</text>
    <text x="360" y="208" text-anchor="middle" font-size="15" fill="#4a5468" font-family="Consolas,monospace">templates/note.html</text>
  </g>
  <g>
    <rect x="505" y="110" width="190" height="150" rx="14" fill="#fff" stroke="#e3dccb" stroke-width="2"/>
    <rect x="525" y="100" width="70" height="18" rx="2" fill="#8a4fd3" opacity="0.8" transform="rotate(-3 560 109)"/>
    <text x="600" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">AI 代理</text>
    <text x="600" y="208" text-anchor="middle" font-size="16" fill="#4a5468">填入七個區塊</text>
  </g>
  <g>
    <rect x="745" y="110" width="190" height="150" rx="14" fill="#fff" stroke="#e3dccb" stroke-width="2"/>
    <rect x="765" y="100" width="70" height="18" rx="2" fill="#1c9a69" opacity="0.8" transform="rotate(-3 800 109)"/>
    <text x="840" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">檢查</text>
    <text x="840" y="208" text-anchor="middle" font-size="16" fill="#4a5468" font-family="Consolas,monospace">check_notes.py</text>
  </g>
  <g>
    <rect x="985" y="110" width="190" height="150" rx="14" fill="#fff" stroke="#e3dccb" stroke-width="2"/>
    <rect x="1005" y="100" width="70" height="18" rx="2" fill="#df861b" opacity="0.8" transform="rotate(-3 1040 109)"/>
    <text x="1080" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">上線</text>
    <text x="1080" y="208" text-anchor="middle" font-size="16" fill="#4a5468">GitHub Pages</text>
  </g>

  <path d="M840 262V330H600V266" fill="none" stroke="#d9482b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <rect x="628" y="314" width="184" height="32" rx="16" fill="#fbf8f1"/>
  <text x="720" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#d9482b">有錯誤 → 回到 AI 修正</text>

  <text x="600" y="392" text-anchor="middle" font-size="16" fill="#7c8496">metadata 由 data/notes.json 統一管理：首頁卡片、篩選、上下篇自動更新</text>
